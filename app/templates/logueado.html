<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVBOX - Home</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            background: #111;
            overflow: hidden;
        }
        .grid-option {
            width: 100%;
            aspect-ratio: 4/3;
            background: #444;
            border: 2px solid #fff;
            border-radius: 8px;
            margin: 0 auto;
            display: grid;
            gap: 3px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .grid-option:hover {
            border-color: #0d6efd;
        }
        .grid-1 {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }
        .grid-1 .cell-1 {
            background: none;
            border: 2px solid #fff;
            border-radius: 4px;
        }
        .grid-9 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .grid-4 {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }
        /* Grilla de 6 videos personalizada */
        .grid-6 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 3px;
            width: 100%;
            aspect-ratio: 4/3;
        }
        .grid-6 .cell-1 {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
        .grid-6 .cell-2 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }
        .grid-6 .cell-3 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }
        .grid-6 .cell-4 {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
        }
        .grid-6 .cell-5 {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
        }
        .grid-6 .cell-6 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
        }
        .grid-6 .cell {
            background: none;
            border: 2px solid #fff;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #fff;
        }
        .grid-option .cell {
            background: none;
            border: 2px solid #fff;
            border-radius: 2px;
        }
        /* Grilla de 9 videos real */
        .video-grid-9 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }
        .video-grid-9 iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #222;
        }
        .video-grid-1 {
            display: flex;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }
        .video-grid-1 iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            background: #222;
        }
        .video-grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }
        .video-grid-4 iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #222;
        }
        .video-grid-6 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 8px;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            overflow: hidden;
            box-sizing: border-box;
        }
        .video-grid-6 .video-edit-container:nth-child(1) { grid-column: 1 / 3; grid-row: 1 / 3; }
        .video-grid-6 .video-edit-container:nth-child(2) { grid-column: 3 / 4; grid-row: 1 / 2; }
        .video-grid-6 .video-edit-container:nth-child(3) { grid-column: 3 / 4; grid-row: 2 / 3; }
        .video-grid-6 .video-edit-container:nth-child(4) { grid-column: 1 / 2; grid-row: 3 / 4; }
        .video-grid-6 .video-edit-container:nth-child(5) { grid-column: 2 / 3; grid-row: 3 / 4; }
        .video-grid-6 .video-edit-container:nth-child(6) { grid-column: 3 / 4; grid-row: 3 / 4; }
        .video-grid-6 iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #222;
        }
        .blurred {
            filter: blur(6px) brightness(0.7);
            transition: filter 0.3s;
        }
        .video-edit-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* min-height: 100px; */
            /* min-width: 100px; */
            /* border: 2px dashed #f00; */ /* DEPURACIÓN: quitar borde */
        }
        .video-edit-container .edit-icon {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            padding: 2px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, box-shadow 0.2s;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-edit-container:hover .edit-icon {
            opacity: 1;
        }
        .video-edit-container .edit-icon svg {
            width: 14px;
            height: 14px;
            display: block;
            fill: #222;
            opacity: 0.7;
        }
        .video-edit-container .edit-url-input {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 260px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1em;
            display: block;
            background: #fff;
            color: #222;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }
        .video-edit-container .edit-url-input[style*="display:none"] {
            display: none !important;
        }
    </style>
</head>

    <!-- Modal de selección de grilla -->
    <div class="modal fade" id="gridModal" tabindex="-1" aria-labelledby="gridModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="gridModalLabel">Elegí tu grilla</h5>
          </div>
          <div class="modal-body">
            <div class="row g-4">
              <!-- Opción 1: 1 video grande -->
              <div class="col-6 col-md-3">
                <div class="grid-option grid-1" data-grid="1">
                  <div class="cell cell-1"></div>
                </div>
                <div class="text-center mt-2">1 video</div>
              </div>
              <!-- Opción 4: 4 videos iguales -->
              <div class="col-6 col-md-3">
                <div class="grid-option grid-4" data-grid="4">
                  <div class="cell"></div><div class="cell"></div>
                  <div class="cell"></div><div class="cell"></div>
                </div>
                <div class="text-center mt-2">4 videos</div>
              </div>
              <!-- Opción 3: 6 videos (uno grande, tres abajo) -->
              <div class="col-6 col-md-3">
                <div class="grid-option grid-6" data-grid="6">
                  <div class="cell cell-1"></div>
                  <div class="cell cell-2"></div>
                  <div class="cell cell-3"></div>
                  <div class="cell cell-4"></div>
                  <div class="cell cell-5"></div>
                  <div class="cell cell-6"></div>
                </div>
                <div class="text-center mt-2">6 videos</div>
              </div>
              <!-- Opción 2: 9 videos -->
              <div class="col-6 col-md-3">
                <div class="grid-option grid-9" data-grid="9">
                  <div class="cell"></div><div class="cell"></div><div class="cell"></div>
                  <div class="cell"></div><div class="cell"></div><div class="cell"></div>
                  <div class="cell"></div><div class="cell"></div><div class="cell"></div>
                </div>
                <div class="text-center mt-2">9 videos</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var myModal = new bootstrap.Modal(document.getElementById('gridModal'));
        myModal.show();

        // Aplica blur al fondo cuando el modal está abierto
        var gridContainer = document.getElementById('video-grid-container');
        var modalEl = document.getElementById('gridModal');
        modalEl.addEventListener('show.bs.modal', function () {
          gridContainer.classList.add('blurred');
        });
        modalEl.addEventListener('hidden.bs.modal', function () {
          gridContainer.classList.remove('blurred');
        });
        // Si el modal ya está abierto al cargar, aplica el blur
        gridContainer.classList.add('blurred');

        // Plantilla de video editable
        function getEditableVideoHTML(src) {
          return `
            <div class="video-edit-container">
              <iframe src="${src}" allowfullscreen></iframe>
              <div class="edit-icon" title="Cambiar video">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75l11.06-11.06-2.83-2.83L3 17.25z"/><path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.13 1.13 3.75 3.75 1.13-1.13z"/></svg>
              </div>
              <input type="text" class="edit-url-input" placeholder="Pega la URL de YouTube y presiona Enter" style="display:none;" />
            </div>
          `;
        }
        // Grillas HTML para cada opción usando la plantilla editable
        const grids = {
          1: `
            <div class="video-grid-1">
              ${getEditableVideoHTML('https://www.youtube.com/embed/dQw4w9WgXcQ')}
            </div>
          `,
          4: `
            <div class="video-grid-4">
              ${getEditableVideoHTML('https://www.youtube.com/embed/dQw4w9WgXcQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/3JZ_D3ELwOQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/l482T0yNkeo')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/tgbNymZ7vqY')}
            </div>
          `,
          6: `
            <div class="video-grid-6">
              ${getEditableVideoHTML('https://www.youtube.com/embed/dQw4w9WgXcQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/3JZ_D3ELwOQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/l482T0yNkeo')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/tgbNymZ7vqY')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/ysz5S6PUM-U')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/ScMzIvxBSi4')}
            </div>
          `,
          9: `
            <div class="video-grid-9">
              ${getEditableVideoHTML('https://www.youtube.com/embed/dQw4w9WgXcQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/3JZ_D3ELwOQ')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/l482T0yNkeo')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/tgbNymZ7vqY')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/ysz5S6PUM-U')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/ScMzIvxBSi4')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/2Vv-BfVoq4g')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/9bZkp7q19f0')}
              ${getEditableVideoHTML('https://www.youtube.com/embed/60ItHLz5WEA')}
            </div>
          `
        };
        // Función para inicializar la lógica de edición en los videos
        function initEditableVideos() {
          // Asegurar autoplay y mute en todos los iframes
          document.querySelectorAll('.video-edit-container iframe').forEach(function(iframe) {
            let src = iframe.getAttribute('src');
            const id = getYouTubeId(src);
            if (id) {
              iframe.setAttribute('src', buildYouTubeSrc(id));
            }
          });
          // Lógica de edición
          document.querySelectorAll('.video-edit-container').forEach(function(container) {
            const editIcon = container.querySelector('.edit-icon');
            const input = container.querySelector('.edit-url-input');
            const iframe = container.querySelector('iframe');
            // Mostrar input al clickear el icono
            editIcon.addEventListener('click', function(e) {
              e.stopPropagation();
              input.style.display = 'block';
              input.focus();
            });
            // Ocultar input al hacer click fuera
            document.addEventListener('click', function(e) {
              if (!container.contains(e.target)) {
                input.style.display = 'none';
                input.value = '';
              }
            });
            // Al presionar Enter, actualizar el iframe
            input.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') {
                const id = getYouTubeId(input.value);
                if (id) {
                  iframe.setAttribute('src', buildYouTubeSrc(id));
                  input.style.display = 'none';
                  input.value = '';
                } else {
                  input.value = '';
                  input.placeholder = 'URL inválida, intenta de nuevo';
                }
              }
            });
            // Al perder el foco, ocultar y limpiar el input
            input.addEventListener('blur', function() {
              input.style.display = 'none';
              input.value = '';
            });
          });
          // Mover el event listener global de Escape fuera del bucle
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
              document.querySelectorAll('.edit-url-input').forEach(function(input) {
                if (input.style.display !== 'none') {
                  input.style.display = 'none';
                  input.value = '';
                }
              });
            }
          });
        }
        // Cambia la grilla al hacer clic en una opción
        document.querySelectorAll('.grid-option').forEach(function(option) {
          option.addEventListener('click', function() {
            var gridType = this.getAttribute('data-grid');
            gridContainer.innerHTML = grids[gridType];
            var modal = bootstrap.Modal.getInstance(document.getElementById('gridModal'));
            modal.hide();
            // Inicializar lógica de edición en los nuevos videos
            setTimeout(initEditableVideos, 100);
          });
        });
        // Inicializar en la carga inicial
        initEditableVideos();

        // Abrir/cerrar el modal con la tecla M
        document.addEventListener('keydown', function(e) {
          if (e.key === 'm' || e.key === 'M') {
            var modalEl = document.getElementById('gridModal');
            var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
            if (modalEl.classList.contains('show')) {
              modal.hide();
            } else {
              modal.show();
            }
          }
        });

        // Función para extraer el ID de un video de YouTube desde una URL
        function getYouTubeId(url) {
          const regExp = /^.*(?:youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#&?]*).*/;
          const match = url.match(regExp);
          return (match && match[1].length === 11) ? match[1] : null;
        }
        // Función para armar el src con autoplay y mute
        function buildYouTubeSrc(id) {
          return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1`;
        }
      });
    </script>
</body>
</html>
